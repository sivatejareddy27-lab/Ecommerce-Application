<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - ECommerce App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }

        .navbar { background: linear-gradient(135deg, #1a1a2e, #0f3460); }

        .hero {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }

        .product-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            overflow: hidden;
        }

        .product-card:hover { transform: translateY(-5px); }

        .product-img {
            background: linear-gradient(135deg, #f0f0f0, #e0e0e0);
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .price { color: #0f3460; font-weight: bold; font-size: 20px; }

        .stock-badge {
            background: #d4edda;
            color: #155724;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .cart-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            padding: 20px;
            position: sticky;
            top: 20px;
        }

        .cart-item {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }

        .total-section {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .btn-add {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            border: none;
            color: white;
            font-weight: bold;
        }

        .btn-add:hover { opacity: 0.9; color: white; }

        .btn-remove {
            background: #dc3545;
            border: none;
            color: white;
        }

        .btn-checkout {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            color: #1a1a2e;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        .empty-cart {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .toast-container { z-index: 9999; }

        .modal-header {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white;
        }

        .qty-input {
            width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold fs-4">
        <i class="bi bi-shop"></i> ShopEasy
    </span>
    <button class="btn btn-outline-light" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
        <i class="bi bi-cart3"></i> Cart
        <span class="badge bg-danger" id="cart-count">0</span>
    </button>
</nav>

<!-- Hero -->
<div class="hero text-center">
    <h1 class="fw-bold">🛍️ Welcome to ShopEasy</h1>
    <p class="lead">Best Products at Best Prices!</p>
</div>

<!-- Toast -->
<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="toast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toast-msg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- Products -->
<div class="container">
    <h3 class="mb-4 fw-bold">📦 Available Products</h3>
    <div class="row g-4" id="products-container">

        <!-- Laptop -->
        <div class="col-md-6 col-lg-3">
            <div class="card product-card h-100">
                <div class="product-img">💻</div>
                <div class="card-body">
                    <h5 class="card-title fw-bold">Laptop</h5>
                    <div class="price mb-2">₹50,000</div>
                    <span class="stock-badge" id="stock-0">Stock: 5</span>
                    <div class="d-flex align-items-center gap-2 mt-3">
                        <input type="number" class="form-control qty-input" id="qty-0" value="1" min="1" max="5">
                        <button class="btn btn-add flex-grow-1" onclick="addToCart(0)">
                            <i class="bi bi-cart-plus"></i> Add
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile -->
        <div class="col-md-6 col-lg-3">
            <div class="card product-card h-100">
                <div class="product-img">📱</div>
                <div class="card-body">
                    <h5 class="card-title fw-bold">Mobile</h5>
                    <div class="price mb-2">₹20,000</div>
                    <span class="stock-badge" id="stock-1">Stock: 10</span>
                    <div class="d-flex align-items-center gap-2 mt-3">
                        <input type="number" class="form-control qty-input" id="qty-1" value="1" min="1" max="10">
                        <button class="btn btn-add flex-grow-1" onclick="addToCart(1)">
                            <i class="bi bi-cart-plus"></i> Add
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- HeadPhones -->
        <div class="col-md-6 col-lg-3">
            <div class="card product-card h-100">
                <div class="product-img">🎧</div>
                <div class="card-body">
                    <h5 class="card-title fw-bold">HeadPhones</h5>
                    <div class="price mb-2">₹30,000</div>
                    <span class="stock-badge" id="stock-2">Stock: 15</span>
                    <div class="d-flex align-items-center gap-2 mt-3">
                        <input type="number" class="form-control qty-input" id="qty-2" value="1" min="1" max="15">
                        <button class="btn btn-add flex-grow-1" onclick="addToCart(2)">
                            <i class="bi bi-cart-plus"></i> Add
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tablets -->
        <div class="col-md-6 col-lg-3">
            <div class="card product-card h-100">
                <div class="product-img">📟</div>
                <div class="card-body">
                    <h5 class="card-title fw-bold">Tablets</h5>
                    <div class="price mb-2">₹15,000</div>
                    <span class="stock-badge" id="stock-3">Stock: 8</span>
                    <div class="d-flex align-items-center gap-2 mt-3">
                        <input type="number" class="form-control qty-input" id="qty-3" value="1" min="1" max="8">
                        <button class="btn btn-add flex-grow-1" onclick="addToCart(3)">
                            <i class="bi bi-cart-plus"></i> Add
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Cart Offcanvas -->
<div class="offcanvas offcanvas-end" id="cartOffcanvas" style="width:380px;">
    <div class="offcanvas-header" style="background:linear-gradient(135deg,#1a1a2e,#0f3460);color:white;">
        <h5 class="offcanvas-title"><i class="bi bi-cart3"></i> Your Cart</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <div id="cart-items">
            <div class="empty-cart">
                <i class="bi bi-cart-x" style="font-size:50px;"></i>
                <p class="mt-2">Cart is Empty!</p>
            </div>
        </div>
        <div class="total-section" id="total-section" style="display:none;">
            <div class="d-flex justify-content-between mb-2">
                <span>Subtotal:</span>
                <span id="subtotal">₹0</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
                <span class="fw-bold fs-5">Total:</span>
                <span class="fw-bold fs-5" id="total">₹0</span>
            </div>
            <button class="btn-checkout" onclick="checkout()">
                <i class="bi bi-bag-check"></i> Place Order
            </button>
        </div>
    </div>
</div>

<!-- Order Success Modal -->
<div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">🎉 Order Placed!</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center py-4">
                <div style="font-size:60px;">🎊</div>
                <h4 class="mt-3">Thank You for Shopping!</h4>
                <p class="text-muted" id="order-summary"></p>
                <p class="fw-bold fs-5 text-success" id="order-total"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100" data-bs-dismiss="modal">Continue Shopping</button>
            </div>
        </div>
    </div>
</div>

<br><br>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const products = ["Laptop", "Mobile", "HeadPhones", "Tablets"];
    const prices = [50000, 20000, 30000, 15000];
    const stock = [5, 10, 15, 8];
    const cart = [0, 0, 0, 0];

    function showToast(msg, type) {
        const toast = document.getElementById("toast");
        toast.className = `toast align-items-center text-white border-0 bg-${type}`;
        document.getElementById("toast-msg").textContent = msg;
        new bootstrap.Toast(toast).show();
    }

    function addToCart(index) {
        const qty = parseInt(document.getElementById(`qty-${index}`).value);
        if (qty <= 0) { showToast("Enter valid quantity!", "danger"); return; }
        if (qty > stock[index]) { showToast("Insufficient stock!", "danger"); return; }

        cart[index] += qty;
        stock[index] -= qty;

        document.getElementById(`stock-${index}`).textContent = `Stock: ${stock[index]}`;
        document.getElementById(`qty-${index}`).max = stock[index];

        updateCart();
        showToast(`✅ ${qty} ${products[index]} added to cart!`, "success");
    }

    function removeFromCart(index) {
        stock[index] += cart[index];
        cart[index] = 0;
        document.getElementById(`stock-${index}`).textContent = `Stock: ${stock[index]}`;
        document.getElementById(`qty-${index}`).max = stock[index];
        updateCart();
        showToast(`❌ ${products[index]} removed from cart!`, "danger");
    }

    function updateCart() {
        const cartItems = document.getElementById("cart-items");
        const totalSection = document.getElementById("total-section");
        const cartCount = document.getElementById("cart-count");

        let html = "";
        let total = 0;
        let count = 0;

        for (let i = 0; i < cart.length; i++) {
            if (cart[i] > 0) {
                const subtotal = cart[i] * prices[i];
                total += subtotal;
                count += cart[i];
                html += `
                <div class="cart-item">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${products[i]}</strong><br>
                            <small class="text-muted">₹${prices[i].toLocaleString()} x ${cart[i]}</small>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold text-success">₹${subtotal.toLocaleString()}</div>
                            <button class="btn btn-remove btn-sm mt-1" onclick="removeFromCart(${i})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
            }
        }

        if (html === "") {
            cartItems.innerHTML = `
                <div class="empty-cart">
                    <i class="bi bi-cart-x" style="font-size:50px;"></i>
                    <p class="mt-2">Cart is Empty!</p>
                </div>`;
            totalSection.style.display = "none";
        } else {
            cartItems.innerHTML = html;
            totalSection.style.display = "block";
            document.getElementById("subtotal").textContent = `₹${total.toLocaleString()}`;
            document.getElementById("total").textContent = `₹${total.toLocaleString()}`;
        }

        cartCount.textContent = count;
    }

    function checkout() {
        let summary = "";
        let total = 0;
        for (let i = 0; i < cart.length; i++) {
            if (cart[i] > 0) {
                summary += `${products[i]} x${cart[i]}, `;
                total += cart[i] * prices[i];
            }
        }

        document.getElementById("order-summary").textContent = summary.slice(0, -2);
        document.getElementById("order-total").textContent = `Total Paid: ₹${total.toLocaleString()}`;

        for (let i = 0; i < cart.length; i++) cart[i] = 0;
        updateCart();

        new bootstrap.Modal(document.getElementById("successModal")).show();
    }
</script>
</body>
</html>
